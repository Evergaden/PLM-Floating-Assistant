name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile-android/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile-android/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile-android
        run: npm ci

      - name: Sync Capacitor project
        working-directory: mobile-android
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: mobile-android/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            mobile-android/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK
        run: |
          mkdir -p mobile-android/dist
          cp mobile-android/android/app/build/outputs/apk/debug/app-debug.apk \
            mobile-android/dist/PLM-Remote-Workbench-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PLM-Remote-Workbench-v1.0.0
          path: mobile-android/dist/PLM-Remote-Workbench-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
