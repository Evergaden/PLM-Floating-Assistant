[package]
name = "plm-product-asset-workbench"
version = "0.1.4"
description = "PLM finalized product asset production workbench"
authors = ["Violet"]
edition = "2024"

[lib]
name = "plm_product_asset_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
futures-util = "0.3"
rand = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["net", "sync", "time"] }
tokio-tungstenite = "0.28"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell"] }
windows-core = "0.61"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
