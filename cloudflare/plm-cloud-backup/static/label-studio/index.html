<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f6fa">
  <title>标签工作室</title>
  <meta name="description" content="输入商品编码，粘贴商品图，批量导出标签 PSD、印刷图和尺寸说明图。">
  <link rel="stylesheet" href="./app.css?v=4">
  <script defer src="./icons.js?v=2"></script>
  <script defer src="./engine.js?v=3"></script>
  <script defer src="./app.js?v=4"></script>
</head>
<body id="label-studio">
  <header class="topbar"><a class="brand" href="./"><span class="brand-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-tags studio-icon" aria-hidden="true" focusable="false"><path d="m15 5 6.3 6.3a2.4 2.4 0 0 1 0 3.4L17 19"></path><path d="M9.586 5.586A2 2 0 0 0 8.172 5H3a1 1 0 0 0-1 1v5.172a2 2 0 0 0 .586 1.414L8.29 18.29a2.426 2.426 0 0 0 3.42 0l3.58-3.58a2.426 2.426 0 0 0 0-3.42z"></path><circle cx="6.5" cy="9.5" r=".5" fill="currentColor"></circle></svg></span><span>标签工作室</span></a></header>
  <main>
    <div class="workspace">
      <aside class="panel intake">
        <div class="section-head"><h2><span class="step">01</span>添加商品</h2></div>
        <label for="sku-input" class="field-label">商品编码</label>
        <textarea id="sku-input" rows="4" placeholder="SKU00012345&#10;SKU00012346&#10;多个编码换行分隔" spellcheck="false"></textarea>
        <button id="add" class="primary full">添加 <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus studio-icon" aria-hidden="true" focusable="false"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
        <div class="list-head"><h3>商品列表 <span id="count">0</span></h3><button id="clear" class="text-button" disabled><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash2 studio-icon" aria-hidden="true" focusable="false"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></svg>清空</button></div>
        <div id="queue" class="queue"><div class="list-empty">暂无商品</div></div>
        <div class="intake-foot"><span id="queue-summary"></span></div>
      </aside>
      <section class="panel editor">
        <div class="editor-top"><div class="section-head"><h2><span class="step">02</span>图片与预览</h2></div><span class="active-sku" id="active-sku"></span></div>
        <div class="editor-body">
          <div class="image-input">
            <label class="dropzone" id="dropzone" tabindex="0" aria-label="选择或粘贴当前商品图片">
              <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
              <img id="source-image" alt="当前商品图" hidden>
              <div id="drop-copy"><span class="upload-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-image-plus studio-icon" aria-hidden="true" focusable="false"><path d="M16 5h6"></path><path d="M19 2v6"></path><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"></path><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path><circle cx="9" cy="9" r="2"></circle></svg></span><strong>粘贴或拖入图片</strong><span>点击选择</span></div>
              <span class="replace-hint" id="replace-hint" hidden>替换图片</span>
            </label>
            <p class="image-help">批量图片以 SKU 命名</p>
          </div>
          <div class="preview-area">
            <div class="preview-toolbar"><div class="segments" role="tablist" aria-label="预览类型"><button id="tab-print" role="tab" aria-selected="true" data-view="print"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-image studio-icon" aria-hidden="true" focusable="false"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>标签预览</button><button id="tab-size" role="tab" aria-selected="false" data-view="size"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-ruler studio-icon" aria-hidden="true" focusable="false"><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"></path><path d="m14.5 12.5 2-2"></path><path d="m11.5 9.5 2-2"></path><path d="m8.5 6.5 2-2"></path><path d="m17.5 15.5 2-2"></path></svg>尺寸说明图</button></div><span id="preview-meta">4 × 3 cm</span></div>
            <div class="preview-stage" id="preview-stage"><div class="preview-empty" id="preview-empty"><span class="empty-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-scan-line studio-icon" aria-hidden="true" focusable="false"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M7 12h10"></path></svg></span><strong>添加图片后预览</strong></div><img id="preview-image" alt="标签预览" hidden></div>
            <div class="preview-caption"><span id="item-status"></span></div>
          </div>
        </div>
        <div class="export-bar"><div><strong>导出</strong><p>PSD · 印刷图 · 尺寸图</p></div><div class="export-actions"><button id="download-current" class="secondary" disabled><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-down studio-icon" aria-hidden="true" focusable="false"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M12 18v-6"></path><path d="m9 15 3 3 3-3"></path></svg>下载当前</button><button id="download-all" class="primary" disabled>下载全部 <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-download studio-icon" aria-hidden="true" focusable="false"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg></button></div></div>
      </section>
    </div>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
