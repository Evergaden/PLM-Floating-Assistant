<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f6fa">
  <title>标签工作室</title>
  <meta name="description" content="输入商品编码，粘贴商品图，批量导出标签 PSD、印刷图和尺寸说明图。">
  <link rel="stylesheet" href="./app.css?v=4">
  <script defer src="./icons.js?v=2"></script>
  <script defer src="./engine.js?v=3"></script>
  <script defer src="./app.js?v=4"></script>
</head>
<body id="label-studio">
  <header class="topbar"><a class="brand" href="./"><span class="brand-icon" aria-hidden="true"><span data-icon="tag" aria-hidden="true"></span></span><span>标签工作室</span></a></header>
  <main>
    <div class="workspace">
      <aside class="panel intake">
        <div class="section-head"><h2><span class="step">01</span>添加商品</h2></div>
        <label for="sku-input" class="field-label">商品编码</label>
        <textarea id="sku-input" rows="4" placeholder="SKU00012345&#10;SKU00012346&#10;多个编码换行分隔" spellcheck="false"></textarea>
        <button id="add" class="primary full">添加 <span data-icon="plus" aria-hidden="true"></span></button>
        <div class="list-head"><h3>商品列表 <span id="count">0</span></h3><button id="clear" class="text-button" disabled><span data-icon="trash" aria-hidden="true"></span>清空</button></div>
        <div id="queue" class="queue"><div class="list-empty">暂无商品</div></div>
        <div class="intake-foot"><span id="queue-summary"></span></div>
      </aside>
      <section class="panel editor">
        <div class="editor-top"><div class="section-head"><h2><span class="step">02</span>图片与预览</h2></div><span class="active-sku" id="active-sku"></span></div>
        <div class="editor-body">
          <div class="image-input">
            <label class="dropzone" id="dropzone" tabindex="0" aria-label="选择或粘贴当前商品图片">
              <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
              <img id="source-image" alt="当前商品图" hidden>
              <div id="drop-copy"><span class="upload-icon" aria-hidden="true"><span data-icon="upload" aria-hidden="true"></span></span><strong>粘贴或拖入图片</strong><span>点击选择</span></div>
              <span class="replace-hint" id="replace-hint" hidden>替换图片</span>
            </label>
            <p class="image-help">批量图片以 SKU 命名</p>
          </div>
          <div class="preview-area">
            <div class="preview-toolbar"><div class="segments" role="tablist" aria-label="预览类型"><button id="tab-print" role="tab" aria-selected="true" data-view="print"><span data-icon="image" aria-hidden="true"></span>标签预览</button><button id="tab-size" role="tab" aria-selected="false" data-view="size"><span data-icon="ruler" aria-hidden="true"></span>尺寸说明图</button></div><span id="preview-meta">4 × 3 cm</span></div>
            <div class="preview-stage" id="preview-stage"><div class="preview-empty" id="preview-empty"><span class="empty-icon" aria-hidden="true"><span data-icon="preview" aria-hidden="true"></span></span><strong>添加图片后预览</strong></div><img id="preview-image" alt="标签预览" hidden></div>
            <div class="preview-caption"><span id="item-status"></span></div>
          </div>
        </div>
        <div class="export-bar"><div><strong>导出</strong><p>PSD · 印刷图 · 尺寸图</p></div><div class="export-actions"><button id="download-current" class="secondary" disabled><span data-icon="file" aria-hidden="true"></span>下载当前</button><button id="download-all" class="primary" disabled>下载全部 <span data-icon="download" aria-hidden="true"></span></button></div></div>
      </section>
    </div>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
